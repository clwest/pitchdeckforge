# PitchDeckForge — dev overlay
#
# Layer on top of docker-compose.yml for live-coding:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  pitchdeckforge_api:
    command: >
      sh -c "python -m app.seed && uvicorn app.main:app
             --host 0.0.0.0 --port 8004 --reload --reload-dir /app"
    volumes:
      - ./backend:/app
    environment:
      PYTHONDONTWRITEBYTECODE: "1"

  pitchdeckforge_web:
    image: node:20-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5176"
    volumes:
      - ./frontend:/app
      - pitchdeckforge_node_modules:/app/node_modules
    ports:
      - "5176:5176"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8004/api}

volumes:
  pitchdeckforge_node_modules:
    name: pitchdeckforge_node_modules
