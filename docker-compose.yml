# PitchDeckForge — prod-like fleet compose
#
# Pattern reference: /Users/donkeyking/development/infra/README.md
# (fleet-net external network owned by the host).
#
# Usage:
#   cp .env.example .env  &&  # edit secrets
#   docker compose up        # prod-like
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up   # dev
#
# Fleet-net prerequisite: `docker network create fleet-net` (one-time).

services:
  pitchdeckforge_postgres:
    image: pgvector/pgvector:pg16
    container_name: pitchdeckforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pitchdeckforge}
      POSTGRES_USER: ${POSTGRES_USER:-pitchdeckforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pitchdeckforge}
    volumes:
      - pitchdeckforge_postgres_data:/var/lib/postgresql/data
    networks:
      - fleet-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pitchdeckforge} -d ${POSTGRES_DB:-pitchdeckforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pitchdeckforge_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pitchdeckforge_api
    restart: unless-stopped
    depends_on:
      pitchdeckforge_postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pitchdeckforge}:${POSTGRES_PASSWORD:-pitchdeckforge}@pitchdeckforge_postgres:5432/${POSTGRES_DB:-pitchdeckforge}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-5-mini}
      SECRET_KEY: ${SECRET_KEY:-dev-only-rotate-me}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5176}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5176}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-}
      STRIPE_PRICE_TEAM_MONTHLY: ${STRIPE_PRICE_TEAM_MONTHLY:-}
      PORT: "8004"
    ports:
      - "8004:8004"
    networks:
      - fleet-net
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8004/api/health\",timeout=2).status==200 else 1)'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pitchdeckforge_web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8004/api}
    container_name: pitchdeckforge_web
    restart: unless-stopped
    depends_on:
      - pitchdeckforge_api
    ports:
      - "5176:80"
    networks:
      - fleet-net

volumes:
  pitchdeckforge_postgres_data:
    name: pitchdeckforge_postgres_data

networks:
  fleet-net:
    external: true
    name: fleet-net
