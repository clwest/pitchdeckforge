databases:
  - name: pitchdeckforge-db
    plan: free
    databaseName: pitchdeckforge
    user: pitchdeckforge

services:
  - type: web
    name: pitchdeckforge-api
    plan: free
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-5-mini
      - key: DATABASE_URL
        fromDatabase:
          name: pitchdeckforge-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://pitchdeckforge.vercel.app
      - key: PYTHON_VERSION
        value: 3.11.0
